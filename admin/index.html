<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isoko Academy — Admin</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <img src="/admin/assets/logo.png" alt="Isoko Academy" style="width:180px;display:block;margin:0 auto 12px">
      <h1>Admin</h1>
      <p class="muted">Admin Dashboard</p>
      <label>Phone number (admin)</label>
      <input id="login-phone" type="tel" placeholder="+250700000001" />
      <div id="otp-row" class="hidden">
        <label>OTP code</label>
        <input id="login-otp" type="text" maxlength="6" placeholder="123456" />
      </div>
      <button id="login-btn" class="btn primary">Send OTP</button>
      <p id="login-msg" class="muted small"></p>
      <p class="muted small">Dev mode: any phone + code <code>123456</code></p>
    </div>
  </div>

  <!-- App shell -->
  <div id="app-view" class="hidden app">
    <aside class="sidebar">
      <div class="brand"><img src="/admin/assets/logo-dark.png" alt="Isoko" style="height:32px"><span>Admin</span></div>
      <nav>
        <a href="#/dashboard" data-nav>Dashboard</a>
        <a href="#/users" data-nav>Users</a>
        <a href="#/content" data-nav>Content</a>
        <a href="#/deposits" data-nav>Deposits</a>
        <a href="#/ai" data-nav>AI Coach</a>
        <a href="#/audit" data-nav>Audit Log</a>
        <a href="#/settings" data-nav>Settings</a>
      </nav>
      <button id="logout-btn" class="btn ghost">Log out</button>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
